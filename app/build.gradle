plugins {
    id 'com.android.application'
}

android {
    namespace 'io.github.stars520.viaswarm'
    compileSdk 34

    // ── 签名配置 ──────────────────────────────────────────
    // 本地的 keystore/release.jks 不进仓库（见 .gitignore）。
    // CI 上从 4 个 Secret 还原：KEYSTORE_B64 / KEY_ALIAS / KEY_PASS / STORE_PASS。
    // 两者都没有时退回 debug 签名，保证 clone 下来就能直接出 APK。
    signingConfigs {
        release {
            def ksPath = System.getenv("VIASWARM_KEYSTORE")
                ?: "${rootDir}/keystore/release.jks"
            def ksFile = file(ksPath)
            if (ksFile.exists()) {
                storeFile ksFile
                storePassword System.getenv("VIASWARM_STORE_PASS") ?: "stars2026"
                keyAlias System.getenv("VIASWARM_KEY_ALIAS") ?: "viaswarm"
                keyPassword System.getenv("VIASWARM_KEY_PASS") ?: "stars2026"
            }
        }
    }

    defaultConfig {
        applicationId "io.github.stars520.viaswarm"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            // 模块本身不联网、不存数据，没东西可混淆，
            // 关掉 minify 让产物可复现、体积最小。
            minifyEnabled false
            // keystore 存在就用 release 签名，否则退回 debug
            def hasReleaseKey = file(
                System.getenv("VIASWARM_KEYSTORE") ?: "${rootDir}/keystore/release.jks"
            ).exists()
            signingConfig hasReleaseKey ? signingConfigs.release : signingConfigs.debug
        }
        debug {
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // 不要让 AGP 压缩 assets，xposed_init 和 js 都必须是原样
    androidResources {
        noCompress 'js', 'txt'
    }

    packagingOptions {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE*', 'META-INF/NOTICE*']
        }
    }

    lint {
        abortOnError false
    }
}

dependencies {
    // ── Xposed API：只编译，绝不打包 ──────────────────────────
    // LSPosed 会校验模块 APK 内是否自带 de.robv.android.xposed.* 类。
    // 一旦自带，它直接拒绝加载并报：
    //   "The Xposed API classes are compiled into the module's APK."
    //   "This may cause strange issues and must be fixed by the module developer."
    //
    // 所以 stub 源码放在项目根的 stubs/ 目录，由根 build.gradle 的
    // :xposedStub 任务打成 jar，这里用 compileOnly 引入：
    // 编译期有符号，运行时由 LSPosed 注入真实实现，dex 里不留这些类。
    compileOnly files(rootProject.layout.buildDirectory.file('xposed-stub.jar'))
}
// 编译前必须先产生 xposed-stub.jar，否则 compileOnly 找不到符号。
tasks.configureEach { t ->
    if (t.name.startsWith('compile') && t.name.endsWith('JavaWithJavac')) {
        t.dependsOn(rootProject.tasks.named('xposedStub'))
    }
}
