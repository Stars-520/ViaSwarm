org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=false
android.nonTransitiveRClass=true

# 关掉 AAPT2 daemon。
# daemon 模式会 fork 一个常驻进程，在某些容器 / proot / 无 libbinder 的
# 精简 Linux 环境里起不来（报 "Daemon startup failed"）。
# 关掉后 aapt2 改为一次性子进程调用，慢一点但稳。
# 指定 aapt2 的绝对路径。
# 本机 SDK 自带的 aapt2 在这个容器里缺动态链接器，直接执行会报
# "cannot execute: required file not found"，只能指到能跑的那个。
android.aapt2FromMavenOverride=/usr/local/bin/aapt2
