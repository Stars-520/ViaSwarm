org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=false
android.nonTransitiveRClass=true

# 说明：此处刻意不写 android.aapt2FromMavenOverride。
# 该属性指向 aapt2 的绝对路径，只在特定机器上有意义
# （例如 proot 容器里 SDK 自带 aapt2 起不来，需要指到 /usr/local/bin/aapt2）。
# 写进仓库会让 GitHub Actions 上因路径不存在而构建失败。
# 本地需要时写进 ~/.gradle/gradle.properties，不要提交。
